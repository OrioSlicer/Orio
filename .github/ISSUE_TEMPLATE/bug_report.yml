name: Bug report
description: Something does not work as it should in Orio.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Ideas and questions go to [Discussions](https://github.com/OrioSlicer/Orio/discussions) instead.
        Please search the existing issues first: if your bug is already there, upvote it and add your details.
  - type: input
    id: version
    attributes:
      label: Orio version
      description: Help > About Orio
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer and connection
      description: Printer model, and LAN mode / cloud / G-code export only.
      placeholder: "Bambu Lab P1S, LAN mode"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step.
      placeholder: |
        1. Open the attached project
        2. Select the bracket, press I
        3. Click Apply
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, what happened
      description: Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: 3MF project
      description: |
        Drag and drop the project (File > Save project, then zip it if GitHub refuses the .3mf). Most slicing bugs cannot be reproduced without it.
        For a crash, also add the log files from `%APPDATA%\Orio\log`. They're plain text, so have a look first: they may contain your file names.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this bug is not reported yet.
          required: true
